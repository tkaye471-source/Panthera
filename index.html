<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panthera Divitiarum</title>

  <!-- Roman-inspired typography -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: #0b0b0b;
      color: #d6d6d6;
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .logo {
      max-width: 280px;
      height: auto;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.8rem;
      letter-spacing: 3px;
      margin: 0;
    }

    .tagline {
      margin-top: 12px;
      font-size: 1.1rem;
      font-style: italic;
      color: #9a9a9a;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: #444;
      margin: 25px auto;
    }
  </style>
</head>

<body>

  <img src="logo.png" alt="Panthera Divitiarum Logo" class="logo">

  <h1>PANTHERA DIVITIARUM</h1>
  <div class="divider"></div>
  <p class="tagline">Wealth is hunted, not hoped for.</p>

</body>
</html>
